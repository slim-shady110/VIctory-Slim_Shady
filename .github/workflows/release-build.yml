name: Release Build

on:
  push:
    branches: [main, slim-shady-balanced]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p victory
      - name: Package VIctory-Slim_Shady bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/scripts | Out-Null
          Copy-Item target/release/victory.exe dist/victory.exe
          Copy-Item PLAY-RTX3050-FG.cmd dist/PLAY-RTX3050-FG.cmd
          Copy-Item Play-VIctory-Slim_Shady.ps1 dist/Play-VIctory-Slim_Shady.ps1
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Copy-Item scripts/play-rtx3050-framegen.ps1 dist/scripts/play-rtx3050-framegen.ps1
          Copy-Item scripts/get-nvidia-sdks.ps1 dist/scripts/get-nvidia-sdks.ps1
          Compress-Archive -Path dist/* -DestinationPath VIctory-Slim_Shady-win64.zip -Force
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIctory-Slim_Shady-win64
          path: VIctory-Slim_Shady-win64.zip
      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VIctory-Slim_Shady-win64.zip
          generate_release_notes: true
